<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SagaForge Playable Prototype</title>
  <style>
    :root{--bg:#070912;--surface:#151820;--surface2:#202633;--line:#3d4555;--text:#f9f6ea;--muted:#bcc5d6;--accent:#f2c14f;--accent2:#43e0c0;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(242,193,79,.18),transparent 30%),radial-gradient(circle at 10% 15%,rgba(67,224,192,.14),transparent 34%),linear-gradient(160deg,#070912,#141523 52%,#111a22);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:flex;justify-content:center;padding:14px}.phone{width:min(100%,430px);min-height:calc(100vh - 28px);border:1px solid rgba(242,193,79,.28);border-radius:28px;overflow:hidden;background:rgba(16,18,26,.96);box-shadow:0 24px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04)}header{display:flex;justify-content:space-between;gap:14px;padding:20px 18px 14px;border-bottom:1px solid rgba(242,193,79,.18);background:linear-gradient(180deg,rgba(255,255,255,.06),transparent)}h1,h2,h3,p{margin:0}.eyebrow{margin-bottom:6px;color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}h1{font-size:25px}.pill{display:inline-flex;align-items:center;border-radius:999px;min-height:32px;padding:0 12px;background:rgba(67,224,192,.18);color:#9ff1df;font-size:12px;font-weight:900}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid rgba(242,193,79,.14)}button{border:0;border-radius:999px;min-height:40px;padding:0 14px;background:linear-gradient(180deg,#313949,#1f2530);color:var(--text);font:inherit;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 18px rgba(0,0,0,.25)}button.active{background:linear-gradient(180deg,#ffe08a,#d9981d);color:#251600}.content{padding:14px}.screen{display:none;gap:12px}.screen.active{display:grid}.card,.panel,.banner{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),var(--surface);padding:14px}.hero{display:grid;grid-template-columns:132px 1fr;gap:14px;min-height:212px;border-color:rgba(242,193,79,.48);background:radial-gradient(circle at 28% 20%,rgba(242,193,79,.16),transparent 38%),linear-gradient(145deg,#171421,#101923 72%);overflow:hidden}.art{background-size:cover;background-position:center;position:relative;overflow:hidden;border-radius:16px;border:1px solid rgba(242,193,79,.42);box-shadow:inset 0 -60px 70px rgba(0,0,0,.5),0 16px 34px rgba(0,0,0,.34)}.key{min-height:190px}.hero-copy{align-self:end;padding:10px 2px}.hero-copy p,.muted{color:var(--muted);line-height:1.55}.metrics,.party,.results,.state-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric,.slot,.result{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px;background:linear-gradient(180deg,#252d3b,#171d28);min-height:76px}.metric span,.slot span,.result small{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.party-art{height:154px;background-position:center 36%;border-color:rgba(67,224,192,.36);box-shadow:inset 0 -80px 70px rgba(0,0,0,.58)}.battle-stage{min-height:300px;background-size:cover;background-position:center;position:relative;border-radius:18px;border:1px solid rgba(67,224,192,.34);box-shadow:inset 0 -130px 120px rgba(0,0,0,.68),0 18px 38px rgba(0,0,0,.38)}.enemy{position:absolute;right:-28px;top:18px;width:214px;height:214px;border-radius:50%;background-size:118%;background-position:center;border:1px solid rgba(67,224,192,.4);box-shadow:inset 0 -45px 60px rgba(0,0,0,.55),0 0 42px rgba(67,224,192,.28)}.enemy span{position:absolute;left:18px;bottom:18px;border-radius:999px;padding:6px 10px;background:rgba(5,8,18,.74);color:#cbfff4;font-size:12px;font-weight:900}.heroes{position:absolute;left:14px;bottom:28px;display:flex;gap:8px;z-index:2}.heroes span{display:grid;place-items:center;width:44px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff5bf,#c78a18 58%,#281708);color:#1a1002;font-weight:1000;border:1px solid rgba(255,255,255,.5);box-shadow:0 0 20px rgba(242,193,79,.45)}.flash{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) rotate(-8deg);padding:8px 18px;border-radius:999px;background:linear-gradient(90deg,rgba(255,245,188,.92),rgba(67,224,192,.82));color:#191108;font-weight:1000;box-shadow:0 0 48px rgba(242,193,79,.6)}.bar{display:grid;gap:6px;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px;background:linear-gradient(180deg,#252d3b,#171d28)}.bar b{font-size:12px;color:var(--muted)}.bar i{display:block;height:8px;border-radius:999px;background:linear-gradient(90deg,#43e0c0,#b8fff0)}.bar i.enemybar{background:linear-gradient(90deg,#ff6b6b,#ffd0d0)}.logs{list-style:none;display:grid;gap:8px;margin:0;padding:0}.logs li{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px;background:linear-gradient(180deg,#252d3b,#171d28)}.summon{min-height:260px;border-radius:18px;border:1px solid rgba(242,193,79,.42);box-shadow:inset 0 -120px 110px rgba(0,0,0,.68),0 16px 34px rgba(0,0,0,.36)}.summon .orb{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);border-radius:999px;padding:10px 18px;background:rgba(5,8,18,.78);border:1px solid rgba(242,193,79,.6);color:#ffe9a9;font-weight:1000}.danger{border-color:rgba(255,107,107,.72);background:rgba(255,107,107,.08)}@media(max-width:360px){.hero,.metrics,.party,.results,.state-grid{grid-template-columns:1fr}.battle-stage{min-height:250px}}
  </style>
</head>
<body>
<div class="wrap"><main class="phone">
  <header><div><p class="eyebrow">Playable Prototype</p><h1>星紋遠征隊</h1></div><span class="pill" id="status">稼働中</span></header>
  <nav class="tabs" id="tabs"></nav>
  <section class="content">
    <div class="screen active" id="home"><div class="card hero"><div class="art key" style="background-image:url(assets/party-key-art.png)"></div><div class="hero-copy"><p class="eyebrow">今日の任務</p><h2>裂光の丘を調査</h2><p>キャラ収集、編成、ターン制バトル、召喚演出を触れる商標非利用プロトタイプ。</p></div></div><div class="metrics"><div class="metric"><span>所持隊員</span><b>6名</b></div><div class="metric"><span>準備度</span><b id="ready">84点</b></div><div class="metric"><span>幻晶</span><b>12個</b></div></div></div>
    <div class="screen" id="party"><div class="panel"><h2>出撃編成</h2><p class="muted">前衛・支援・術師を組み合わせると出撃可能。</p></div><div class="art party-art" style="background-image:url(assets/party-key-art.png)"></div><div class="party" id="partySlots"></div></div>
    <div class="screen" id="battle"><div class="battle-stage" style="background-image:linear-gradient(180deg,rgba(9,11,20,.08),rgba(9,11,20,.86)),url(assets/battle-ruins.png)"><div class="heroes"><span>槍</span><span>策</span><span>術</span></div><div class="enemy" style="background-image:url(assets/crystal-guardian.png)"><span>晶狼ガーディアン</span></div><div class="flash" id="flash">星紋連携</div></div><div class="banner" id="result">交戦中: コマンドを選択</div><div class="metrics"><div class="bar"><b>隊列HP</b><i id="heroBar" style="width:88%"></i><strong id="heroHp">88</strong></div><div class="bar"><b>敵HP</b><i class="enemybar" id="enemyBar" style="width:76%"></i><strong id="enemyHp">76</strong></div></div><div class="state-grid"><button onclick="attack('連携斬')">連携斬</button><button onclick="attack('回復術')">回復術</button><button onclick="attack('防御陣')">防御陣</button><button onclick="resetBattle()">再戦</button></div><ul class="logs" id="logs"></ul></div>
    <div class="screen" id="gacha"><div class="art summon" style="background-image:linear-gradient(180deg,rgba(5,8,18,.06),rgba(5,8,18,.76)),url(assets/summon-altar.png)"><div class="orb">幻晶解放</div></div><button onclick="pull()">10連風に引く</button><div class="results" id="results"></div></div>
    <div class="screen" id="state"><div class="panel"><h2>失敗状態を試す</h2><p class="muted">AIDDの検証用。成功画面だけでなく、失敗状態も触れる。</p></div><div class="state-grid"><button onclick="setFailure('offline')">offline</button><button onclick="setFailure('timeout')">timeout</button><button onclick="setFailure('payment_failed')">payment_failed</button><button onclick="clearFailure()">success</button></div><div class="panel danger" id="failure" style="display:none"><p class="eyebrow" id="failureName"></p><h2>状態を確認してください</h2><p id="failureText"></p></div></div>
  </section>
</main></div>
<script>
const tabs=[['home','ホーム'],['party','編成'],['battle','戦闘'],['gacha','召喚'],['state','状態']];
const chars=[['紅槍リオ','前衛','Lv.28'],['翠策ミナ','支援','Lv.31'],['銀術セナ','術師','Lv.30'],['盾士ガル','前衛','Lv.24']];
let hero=88, enemy=76, turn=1;
function $(id){return document.getElementById(id)}
function init(){ $('tabs').innerHTML=tabs.map(([id,label])=>`<button class="${id==='home'?'active':''}" onclick="show('${id}',this)">${label}</button>`).join(''); $('partySlots').innerHTML=chars.map(c=>`<div class="slot"><span>${c[1]}</span><b>${c[0]}</b><small>${c[2]}</small></div>`).join(''); resetBattle(); pull(); }
function show(id,btn){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(e=>e.classList.remove('active'));btn.classList.add('active')}
function attack(name){ const dmg=name==='連携斬'?22:name==='防御陣'?10:14; const heal=name==='回復術'?16:0; enemy=Math.max(0,enemy-dmg); hero=Math.min(100,Math.max(0,hero+heal-(enemy?8:0))); turn++; $('logs').insertAdjacentHTML('afterbegin',`<li>ターン${turn}: ${name}。敵に${dmg}、隊列HP${hero}。</li>`); renderBattle(); }
function renderBattle(){ $('heroHp').textContent=hero; $('enemyHp').textContent=enemy; $('heroBar').style.width=hero+'%'; $('enemyBar').style.width=enemy+'%'; $('result').textContent=enemy<=0?'勝利: 星屑報酬を獲得':hero<=0?'敗北: 再編成が必要':'交戦中: コマンドを選択'; $('flash').textContent=enemy<=0?'勝利演出':'星紋連携'; }
function resetBattle(){hero=88;enemy=76;turn=1;$('logs').innerHTML='<li>ターン1: 晶狼ガーディアンが出現。</li>';renderBattle();}
function pull(){ const items=['新隊員候補','強化紋章','訓練素材','深翠星紋']; $('results').innerHTML=Array.from({length:6},(_,i)=>`<div class="result"><span>${i%3===0?'煌':i%2?'翠':'銀'}</span><b>${items[i%items.length]}</b><small>${i%3===0?'高レア風':'通常結果'}</small></div>`).join(''); }
function setFailure(s){ $('failure').style.display='block'; $('status').textContent='要確認'; $('status').style.background='rgba(255,107,107,.16)'; $('failureName').textContent=s; $('failureText').textContent=s==='offline'?'通信できない状態です。':s==='timeout'?'応答が遅延しています。':'幻晶購入のmock決済が失敗しました。'; }
function clearFailure(){ $('failure').style.display='none'; $('status').textContent='稼働中'; $('status').style.background='rgba(67,224,192,.18)'; }
init();
</script>
</body>
</html>
